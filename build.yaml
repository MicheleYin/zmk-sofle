---
include:
  - board: nice_nano/nrf52840/zmk
    shield: eyelash_sofle_left nice_view
    artifact-name: eyelash_sofle_left_nice_view
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n -DCONFIG_SETTINGS=y -DCONFIG_ZMK_WPM=y -DCONFIG_ZMK_SVG=y -DCONFIG_ZMK_SVG_SCREEN=y -DCONFIG_ZMK_SVG_THEME_LEFT=y -DCONFIG_ZMK_SVG_CENTRAL_RIGHT_HALF=n -DCONFIG_NICE_VIEW_WIDGET_STATUS=n
  - board: nice_nano/nrf52840/zmk
    shield: eyelash_sofle_right nice_view
    artifact-name: eyelash_sofle_right_nice_view
    cmake-args: -DCONFIG_SETTINGS=y -DCONFIG_ZMK_WPM=y -DCONFIG_ZMK_SVG=y -DCONFIG_ZMK_SVG_SCREEN=y -DCONFIG_ZMK_SVG_THEME_RIGHT=y -DCONFIG_ZMK_SVG_CENTRAL_RIGHT_HALF=n -DCONFIG_NICE_VIEW_WIDGET_STATUS=n
  - board: nice_nano/nrf52840/zmk
    shield: settings_reset
    artifact-name: settings_reset
